[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensnap"
dynamic = ["version"]
description = "Agent-based model visualization toolkit - Python bindings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "billstark001", email = "billstark001@example.com" }]
keywords = ["agent-based-modeling", "simulation", "visualization", "abm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.24.0",
  "msgpack>=1.0.5",
  "websockets>=12.0",
  "typing-extensions>=4.13.0",
]

[project.urls]
Homepage = "https://github.com/billstark001/tensnap"
Documentation = "https://github.com/billstark001/tensnap/tree/main/docs"
Repository = "https://github.com/billstark001/tensnap"
Issues = "https://github.com/billstark001/tensnap/issues"

[tool.setuptools.dynamic]
version = {attr = "tensnap._version.__version__"}

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "mypy>=1.7.0",
  "pyright>=1.1.411",
  "Pillow>=10.0",
  "ruff>=0.1.0",
  "black>=23.0.0",
  "mesa>=3.0.0",
  "networkx>=3.0",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["msgpack", "networkx", "mesa", "mesa.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "tensnap.bindings.basic.parameter",
  "tensnap.bindings.basic.chart",
  "tensnap.bindings.mesa.datacollector",
  "tensnap.bindings.mesa.handler",
  "tensnap.utils.attr",
  "tensnap.utils.object",
  "tensnap.utils.environment_state",
  "tensnap.utils.model",
  "tensnap.utils.ws",
  "tensnap.server",
  "tensnap.scenario",
  "tensnap.sim_loop",
]
ignore_errors = true

[tool.ruff]
line-length = 88
target-version = "py310"

extend-exclude = [
  "tensnap/bindings/basic/parameter.py",
  "tensnap/bindings/basic/chart.py",
  "tensnap/bindings/mesa/datacollector.py",
  "tensnap/bindings/mesa/handler.py",
  "tensnap/server.py",
  "tensnap/scenario.py",
  "tensnap/utils/environment_state.py",
  "tensnap/utils/model.py",
  "tensnap/utils/object.py",
  "tensnap/utils/ws.py",
]

[tool.pyright]
pythonVersion = "3.10"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict".msg = "Use typing_extensions.TypedDict for generic and PEP 728 support on Python 3.10."
"typing.NotRequired".msg = "Use typing_extensions.NotRequired for Python 3.10."
"typing.Required".msg = "Use typing_extensions.Required for Python 3.10."
"typing.Self".msg = "Use typing_extensions.Self for Python 3.10."
"typing.Unpack".msg = "Use typing_extensions.Unpack for Python 3.10."
"typing.TypeVarTuple".msg = "Use typing_extensions.TypeVarTuple for Python 3.10."
"typing.LiteralString".msg = "Use typing_extensions.LiteralString for Python 3.10."
"typing.Never".msg = "Use typing_extensions.Never for Python 3.10."
"typing.assert_type".msg = "Use typing_extensions.assert_type for Python 3.10."
"typing.assert_never".msg = "Use typing_extensions.assert_never for Python 3.10."
"typing.reveal_type".msg = "Use typing_extensions.reveal_type for Python 3.10."
"typing.dataclass_transform".msg = "Use typing_extensions.dataclass_transform for Python 3.10."
"typing.override".msg = "Use typing_extensions.override for Python 3.10."
"typing.ReadOnly".msg = "Use typing_extensions.ReadOnly for Python 3.10."
"typing.TypeIs".msg = "Use typing_extensions.TypeIs for Python 3.10."
"typing.TypeAliasType".msg = "Use typing_extensions.TypeAliasType for Python 3.10."
"typing.NoDefault".msg = "Use typing_extensions.NoDefault for Python 3.10."

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tensnap/__init__.py" = ["F401", "F403"]
"tensnap/models/__init__.py" = ["F401", "F403"]
"tensnap/bindings/basic/__init__.py" = ["F401", "F403"]
"tensnap/bindings/basic/layer.py" = ["PLR0913", "PLR2004"]
"tensnap/bindings/basic/projector.py" = ["PLR0913"]
"tensnap/handler.py" = ["N814"]
"tensnap/helper.py" = ["N814"]
"tensnap/bindings/mesa/projector.py" = ["PLR0913"]
"tensnap/models/agent.py" = ["PLR0913"]
"tensnap/models/environment.py" = ["PLR0913"]
"tensnap/models/parameter.py" = ["PLR0913"]
"tensnap/utils/attr.py" = ["PLR0913"]
"tensnap/utils/codec.py" = ["PLR0911", "PLR0913"]
"tensnap/utils/init_hook.py" = ["B010"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=tensnap --cov-report=html --cov-report=term-missing"

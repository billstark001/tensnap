[package]
name = "tensnap-tauri"
version = "0.1.0"
description = "A Tauri App for TenSnap visualization"
authors = ["Bill Toshiaki Stark"]
license = ""
repository = ""
default-run = "tensnap-tauri"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.0.0-alpha.2"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[[bin]]
name = "tensnap-tauri"
path = "src/main.rs"

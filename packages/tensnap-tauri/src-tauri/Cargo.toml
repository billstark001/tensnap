[package]
name = "tensnap-tauri"
version = "0.3.2"
description = "A Tauri App for TenSnap visualization"
authors = ["Bill Toshiaki Stark"]
license = ""
repository = ""
default-run = "tensnap-tauri"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-persisted-scope = "2.4.0"
tauri-plugin-store = "2.5.0"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[[bin]]
name = "tensnap-tauri"
path = "src/main.rs"

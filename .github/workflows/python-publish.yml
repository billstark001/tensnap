name: Publish Python Package

on:
  push:
    tags:
      - 'py-v*'  # Trigger on tags like py-v0.1.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build protocol schemas
        run: pnpm --filter @tensnap/protocol build
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        working-directory: packages/tensnap-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run tests
        working-directory: packages/tensnap-python
        run: |
          pytest --cov=tensnap --cov-report=xml

      - name: Check Python types
        working-directory: packages/tensnap-python
        run: |
          ruff check tensnap
          find tensnap -type f -name '*.py' -print0 | xargs -0 ruff check --select TID251
          mypy tensnap tests/typing/layer_kwargs.py
          pyright tensnap/bindings/basic/layer_kwargs.py tensnap/bindings/basic/layer.py tensnap/bindings/basic/agent_layers.py tests/typing/layer_kwargs.py tests/typing/pep728_metadata.py
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./packages/tensnap-python/coverage.xml
          flags: python

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        working-directory: packages/tensnap-python
        run: python -m build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/tensnap-python/dist/

name: Protocol conformance matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cross-binding-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e packages/tensnap-python
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tensnap-go/go.mod
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - run: julia --project=packages/tensnap-julia -e 'using Pkg; Pkg.instantiate()'
      - name: Verify retained matrix against all four bindings
        run: python conformance/run_matrix.py --check

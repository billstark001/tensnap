name: TenSnap CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tensnap/protocol build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e 'packages/tensnap-python[dev]'
      - run: pnpm --filter @tensnap/python lint
      - run: python -m pytest -q -o addopts='' packages/tensnap-python/tests
      - name: Verify installed Python wheel and example views
        run: |
          python -m pip install -r examples/python_llm/requirements.txt wheel 'setuptools>=61'
          python packages/tensnap-python/scripts/verify_package.py

  cross-binding-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/network lint
      - run: pnpm --dir packages/network test
      - run: pnpm --dir packages/network build
      - run: pnpm --dir packages/tensnap-agent lint
      - run: pnpm --dir packages/tensnap-agent test
      - run: pnpm exec tsc --noEmit -p conformance/tsconfig.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'packages/tensnap-python[dev]'
      - run: pnpm --filter @tensnap/python lint
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tensnap-go/go.mod
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - run: julia --project=packages/tensnap-julia -e 'using Pkg; Pkg.instantiate()'
      - name: Run live conformance against all four bindings
        run: python conformance/run_matrix.py --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - name: Check versions, bundled docs and JavaScript lint
        run: |
          pnpm check:versions
          pnpm --filter @tensnap/agent skills:check
          pnpm lint:js
      - name: Check frontend types
        run: pnpm --filter @tensnap/core --filter @tensnap/web-common --filter @tensnap/web-adapter --filter @tensnap/web --filter @tensnap/tauri typecheck
      - name: Check catalogs
        run: |
          pnpm i18n:verify
          git diff --exit-code -- packages/tensnap-web/src/locales packages/tensnap-tauri/src/locales packages/web-adapter/src/locales
      - name: Test renderer and frontend behavior
        run: |
          pnpm --filter @tensnap/core test
          pnpm --filter @tensnap/web-adapter test
          pnpm --filter @tensnap/web test
          pnpm --filter @tensnap/benchmark exec vitest run src/evaluation/evaluation.test.ts
      - name: Build renderer and Web
        run: |
          pnpm --filter @tensnap/core build
          pnpm --filter @tensnap/web build

  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/tensnap-tauri/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build desktop without bundling or publishing
        run: pnpm --filter @tensnap/tauri exec tauri build --debug --no-bundle
      - name: Test native menu behavior
        run: cargo test --locked --manifest-path packages/tensnap-tauri/src-tauri/Cargo.toml
